services:
  vod_uploader:
    build: .
    container_name: vod_uploader
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - TELEGRAM_API_ID
      - TELEGRAM_API_HASH
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - TELEGRAM_FORUM_CHAT_ID
      - FORWARD_DROP_AUTHOR
      - PARALLEL_UPLOAD_WORKERS
      - ALLOWED_DASHBOARD_USERS
      - DOWNLOAD_INACTIVITY_TIMEOUT
      - FFMPEG_THREADS
      - RSS_ENABLED
      - RSS_OPML_FILE
      - RSS_FEED_TITLES
      - RSS_FEED_URLS
      - RSS_STATE_FILE
      - RSS_POLL_INTERVAL_SECONDS
      - RSS_INITIAL_BACKFILL
      - RSS_MAX_ITEM_AGE_HOURS
      - RSS_MAX_ITEMS_PER_POLL
      - RSS_MAX_RETRIES
      - RSS_RETRY_BASE_SECONDS
      - RSS_RETRY_MAX_DELAY_SECONDS
      - RSS_LIVE_RECHECK_SECONDS
      - RSS_ALLOW_LIVE
      - RSS_STATE_RETENTION_DAYS
      - RSS_TOPIC_PER_FEED
      - RSS_ARCHIVE_CHAT_ID
      - RSS_ARCHIVE_FORUM_CHAT_ID
      - YTDLP_COOKIES_FILE
      - YTDLP_CONCURRENT_FRAGMENTS
      - YTDLP_RETRIES
      - YTDLP_HTTP_CHUNK_SIZE
      - YTDLP_FORMAT
      - DOWNLOAD_CHUNK_SIZE
      - N8N_WEBHOOKS
      - N8N_WEBHOOK_TIMEOUT
      - N8N_TRIGGER_COOLDOWN
      - STATE_DIR
      - JOB_DONE_TTL_DAYS
      - JOB_STALE_DAYS
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
    volumes:
      - ./topics_cache.json:/app/topics_cache.json
      - ./vod_bot_session.session:/app/vod_bot_session.session
      - ./rss_data:/app/rss_data
      - ./state_data:/app/state
      # OPML-Datei wird nicht mehr benoetigt, da RSS_FEED_URLS genutzt wird.
      # Fuer den Rueckfall auf eine lokale OPML wieder einkommentieren:
      # - ../rss-app-opml.xml:/app/rss-app-opml.xml:ro
      # Optional: Netscape-Cookies fuer yt-dlp (X/Twitter/YouTube-Login)
      # - ./ytdlp:/app/ytdlp:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.voduploader.rule=Host(`02njtne.cserverhost.cloud`) && (PathPrefix(`/voduploader`) || PathPrefix(`/voduploader/`))"
      - "traefik.http.routers.voduploader.entrypoints=websecure"
      - "traefik.http.routers.voduploader.tls=true"
      - "traefik.http.routers.voduploader.tls.certresolver=le"
      - "traefik.http.services.voduploader.loadbalancer.server.port=8080"
    networks:
      - default
      - n8n_n8n-network
      - traefik-net

networks:
  default:
  n8n_n8n-network:
    external: true
  traefik-net:
    external: true

