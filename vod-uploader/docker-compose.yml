services:
  vod_uploader:
    build: .
    container_name: vod_uploader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_API_ID
      - TELEGRAM_API_HASH
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
    networks:
      - default

networks:
  default:
    name: toktrackerapp_toktracker_net
    external: true
