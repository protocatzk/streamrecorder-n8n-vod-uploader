services:
  vod_uploader:
    build: .
    container_name: vod_uploader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_API_ID
      - TELEGRAM_API_HASH
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - PARALLEL_UPLOAD_WORKERS
    networks:
      - default
      - n8n_n8n-network

networks:
  default:
  n8n_n8n-network:
    external: true

