services:
  vod_uploader:
    build: .
    container_name: vod_uploader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_API_ID
      - TELEGRAM_API_HASH
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - TELEGRAM_FORUM_CHAT_ID
      - FORWARD_DROP_AUTHOR
      - PARALLEL_UPLOAD_WORKERS
    volumes:
      - ./topics_cache.json:/app/topics_cache.json
      - ./vod_bot_session.session:/app/vod_bot_session.session
    networks:
      - default
      - n8n_n8n-network

networks:
  default:
  n8n_n8n-network:
    external: true

