<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RippersArchiv – Topic & VOD Suche</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131926;
      --surface-2: #1a2233;
      --border: #263147;
      --text: #eef2f8;
      --muted: #93a1b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --tg: #2aabee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top, #131d31 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 36px 18px 64px;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }
    .subtitle a {
      color: var(--accent);
      text-decoration: none;
    }
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }
    .search-input {
      width: 100%;
      padding: 15px 46px 15px 18px;
      font-size: 1.05rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
    }
    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      display: none;
    }
    .clear-btn.visible { display: block; }
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
      padding: 0 4px;
    }
    .results {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      transition: border-color 0.15s;
    }
    .card:hover {
      border-color: #364766;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .topic-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .aliases {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .alias-chip {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .btn-tg {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--tg);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 9px 14px;
      border-radius: 9px;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-tg:hover { background: var(--accent-hover); }
    .vods-section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .vods-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .vod-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .vod-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, transform 0.1s;
    }
    .vod-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .vod-title {
      font-size: 0.92rem;
      font-weight: 500;
      margin-bottom: 3px;
      word-break: break-word;
    }
    .vod-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .vod-link-badge {
      font-size: 0.8rem;
      color: var(--accent);
      white-space: nowrap;
      font-weight: 600;
    }
    .empty-vods {
      font-size: 0.84rem;
      color: var(--muted);
      font-style: italic;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>RippersArchiv Suche</h1>
      <p class="subtitle">
        Finde Streamer-Topics &amp; die letzten 3 VODs in
        <a href="https://t.me/RippersArchiv" target="_blank" rel="noopener">@RippersArchiv</a>
      </p>
    </header>

    <div class="search-box">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Streamer / Username suchen (z. B. apacat, ariele_187, steffi89er)..."
        autocomplete="off"
        autofocus
      />
      <button id="clearBtn" class="clear-btn" type="button" title="Suche leeren">&times;</button>
    </div>

    <div class="stats">
      <span id="statsLeft">Lade Index...</span>
      <span id="statsRight"></span>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script>
    const input = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const resultsEl = document.getElementById("results");
    const statsLeft = document.getElementById("statsLeft");
    const statsRight = document.getElementById("statsRight");

    const apiBase = window.location.pathname.startsWith("/search")
      ? "/search/api/search"
      : "/api/search";

    let timer = null;
    let activeController = null;

    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    function syncUrl(q) {
      const url = new URL(window.location.href);
      if (q) url.searchParams.set("q", q);
      else url.searchParams.delete("q");
      window.history.replaceState({}, "", url);
    }

    function render(data) {
      statsLeft.textContent = data.query
        ? `${data.count} Treffer für „${data.query}“`
        : `Zeige ${data.count} von ${data.total_topics} Topics`;
      statsRight.textContent = `${data.total_topics} Topics · ${data.indexed_vods} indexierte VODs`;

      if (!data.results.length) {
        resultsEl.innerHTML = `<div class="empty-state">Kein Topic für „${esc(data.query)}“ gefunden.</div>`;
        return;
      }

      resultsEl.innerHTML = data.results.map(item => {
        const aliasesHtml = item.aliases
          .map(a => `<span class="alias-chip">${esc(a)}</span>`)
          .join("");

        let vodsHtml = `<div class="empty-vods">Noch keine VODs im Index (neue Uploads erscheinen automatisch).</div>`;
        if (item.vods && item.vods.length) {
          vodsHtml = `<div class="vod-list">` + item.vods.map(v => {
            const metaParts = [];
            if (v.recorded_at || v.finished_at) metaParts.push(formatDate(v.recorded_at || v.finished_at));
            if (v.duration) metaParts.push(v.duration);
            if (v.size_mb) metaParts.push(`${v.size_mb} MB`);
            if (v.parts && v.parts > 1) metaParts.push(`${v.parts} Teile`);
            return `
              <a class="vod-item" href="${esc(v.url)}" target="_blank" rel="noopener">
                <div>
                  <div class="vod-title">${esc(v.title)}</div>
                  <div class="vod-meta">${esc(metaParts.join(" · "))}</div>
                </div>
                <span class="vod-link-badge">VOD öffnen &rarr;</span>
              </a>
            `;
          }).join("") + `</div>`;
        }

        return `
          <div class="card">
            <div class="card-top">
              <div>
                <h2 class="topic-title">${esc(item.display_name)}</h2>
                <div class="aliases">${aliasesHtml}</div>
              </div>
              <a class="btn-tg" href="${esc(item.topic_url)}" target="_blank" rel="noopener">
                Topic öffnen &rarr;
              </a>
            </div>
            <div class="vods-section">
              <div class="vods-label">Letzte VODs</div>
              ${vodsHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    async function runSearch(q) {
      if (activeController) activeController.abort();
      activeController = new AbortController();
      clearBtn.classList.toggle("visible", q.length > 0);
      syncUrl(q);

      try {
        const res = await fetch(`${apiBase}?q=${encodeURIComponent(q)}&limit=30`, {
          signal: activeController.signal
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
      } catch (err) {
        if (err.name === "AbortError") return;
        resultsEl.innerHTML = `<div class="empty-state">Fehler beim Laden: ${esc(err.message)}</div>`;
      }
    }

    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => runSearch(input.value.trim()), 150);
    });

    clearBtn.addEventListener("click", () => {
      input.value = "";
      input.focus();
      runSearch("");
    });

    const initialQ = new URLSearchParams(window.location.search).get("q") || "";
    input.value = initialQ;
    runSearch(initialQ);
  </script>
</body>
</html>
